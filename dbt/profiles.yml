fma_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_DB_HOST', 'postgres-warehouse') }}"
      port: "{{ env_var('WAREHOUSE_DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB_NAME', 'music_features') }}"
      user: "{{ env_var('WAREHOUSE_DB_USER', 'warehouse') }}"
      password: "{{ env_var('WAREHOUSE_DB_PASSWORD', 'warehouse') }}"
      schema: public
      threads: 4
      connect_timeout: 10
